# Builds the installers of Ramure: an NSIS setup on Windows, a .deb and an AppImage on Ubuntu.
#
# - On a `v*` tag: checks and tests, then a draft GitHub release with the installers, signed for
#   the in-app updates, and `latest.json`, which the installed copies read. Publishing the draft
#   by hand is what makes the version public (docs/releasing.md).
# - On a pull request that touches the build, and when run by hand: the same build, nothing
#   published. The installers are kept as artifacts of the run.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - scripts/version.mjs
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.release.conf.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A tag only: the tag must be the version of the application, and the draft exists before the
  # two builds upload to it, so that they do not each create one.
  draft:
    name: Draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: The tag is the version of the application, and its updates can be verified
        run: node scripts/version.mjs --tag "$GITHUB_REF_NAME"
      - name: Create the draft, unless a run of this tag already did
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "Ramure ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: draft
    # `draft` is skipped outside a tag: the build still runs.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu supported: what is built there runs on 24.04 too.
          - name: Ubuntu
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      # To upload to the draft, on a tag. A pull request from a fork gets a read-only token.
      contents: write
    steps:
      # Files as they are in the repository: no CRLF on Windows, which tests and checks would read.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check
      # In release: the build that follows reuses what the tests compiled.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --release --locked
      - name: Build the installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Read on a tag only: the key that signs the installers for the in-app updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          # On a tag, the installers are signed and `latest.json` is written. A dry run signs
          # nothing: it needs no secret.
          args: ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.release.conf.json' || '' }}
          updaterJsonPreferNsis: true
          # Outside a tag, no release is named and nothing is published.
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
