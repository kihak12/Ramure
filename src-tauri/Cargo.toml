[package]
name = "ramure"
version = "0.0.1"
description = "Graphical Git client and SSH/SFTP client"
authors = ["Ramure contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ramure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# `ring` rather than `aws-lc-rs`: it builds on Windows without NASM or CMake.
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }
rand = "0.10"
# Pseudo-terminal for local terminals: ConPTY on Windows, openpty elsewhere.
portable-pty = "0.9.0"
# System keyring: Credential Manager on Windows, Secret Service on Linux
# (through zbus, with no system library to install).
keyring = "4.2"
# Reading `known_hosts` (hashed `|1|` names): the versions russh already builds.
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2.11"
