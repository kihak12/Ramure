[package]
name = "ramure"
version = "0.0.1"
description = "Client Git graphique et client SSH/SFTP"
authors = ["Ramure contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ramure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# `ring` plutôt que `aws-lc-rs` : se compile sous Windows sans NASM ni CMake.
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v4"] }
rand = "0.10"
# Pseudo-terminal des terminaux locaux : ConPTY sous Windows, openpty ailleurs.
portable-pty = "0.9.0"
